name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar la pantalla de la Caja
        run: python3 tools/build_www.py
      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | tr -d " \r\n" | base64 -d > app/caja.keystore; fi
          test -f app/caja.keystore || { echo "Falta la llave de firma (secreto KEYSTORE_B64)"; exit 1; }
      - name: Compilar
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Caja-Panda-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk Caja-Panda.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Caja Panda v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            Caja-Panda-v1.0.${{ github.run_number }}.apk
            Caja-Panda.apk

  # Versión web para usar la Caja desde la computadora (GitHub Pages).
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_www.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets/www
      - id: deploy
        uses: actions/deploy-pages@v4
